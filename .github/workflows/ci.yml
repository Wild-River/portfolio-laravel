name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで新しい push があったら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # 本番（さくら）に合わせて 8.0
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # .env と phpunit.xml より優先される
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v7

      - name: PHP をセットアップ
        uses: shivammathur/setup-php@v2
        with:
          # 本番（さくら）は 8.3.36。パッチ番号までは固定できないので 8.3 の最新を使う
          # パッケージは composer.json の platform（8.3.36）に合わせて選ばれる
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, pdo_sqlite, gd
          coverage: none

      - name: Node.js をセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Composer のキャッシュ先を取得
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer のパッケージをキャッシュ
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: PHP のパッケージをインストール
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: JS のパッケージをインストール
        run: npm ci

      # 画面を表示するテストは @vite の manifest.json が必要なので、テストより前にビルドする
      - name: フロントエンドをビルド
        run: npm run build

      - name: .env を用意
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: コードの書き方をチェック（Pint）
        run: vendor/bin/pint --test

      - name: テストを実行
        run: php artisan test

  deploy:
    # テストが通って、main に push されたときだけデプロイする
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Node.js をセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: フロントエンドをビルド
        run: |
          npm ci
          npm run build

      - name: SSH を準備
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: メンテナンスモードにする
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ~/portfolio-laravel && php artisan down"

      - name: ビルドしたファイルを送る
        run: rsync -az public/build/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:portfolio-laravel/public/build/

      - name: サーバを更新
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ~/portfolio-laravel && git pull && php composer.phar install --no-dev --optimize-autoloader --no-interaction && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan up"
